ursor:default}#feedback{margin:.7em 0}small{color:#416581}.spark{position:fixed;top:-20px;pointer-events:none;animation:fall 2s ease-in forwards}@keyframes fall{to{transform:translateY(110vh) rotate(300deg)}}@media(max-width:600px){.row{gap:5px}.name{width:5em}.choices button{padding:12px 5px}header button{font-size:16px}}
</style><main><header><h1>Шаршылар жарысы</h1><div><button id="sound" aria-label="Дыбыс">🔊</button> <button id="full" aria-label="Толық экран">⛶</button></div></header><section id="arena"></section><section id="panel" aria-live="polite"></section></main><script>
const teams=['Көк шаршы','Алтын шаршы','Қызыл шаршы'],colors=['#80d7ff','#ffd35b','#ff9c95'];
let scores=[0,0,0],turn=0,locked=false,audioOn=true,context;
function lanes(active=-1){
 arena.innerHTML=teams.map((name,i)=>'<div class="row '+(active===i?'active':'')+'"><span class="name">'+name+'</span><div class="track"><b class="runner" style="background:'+colors[i]+';left:calc('+scores[i]*20+'% - '+scores[i]*7.6+'px)">•ᴗ•</b></div><b>'+scores[i]+'/5</b></div>').join('');
}
function beep(freq){if(!audioOn)return;try{context??=new AudioContext();context.resume();const osc=context.createOscillator(),gain=context.createGain();osc.connect(gain);gain.connect(context.destination);osc.frequency.value=freq;gain.gain.value=.07;gain.gain.exponentialRampToValueAtTime(.001,context.currentTime+.22);osc.start();osc.stop(context.currentTime+.23)}catch{}}
sound.onclick=()=>{audioOn=!audioOn;sound.textContent=audioOn?'🔊':'🔇'};
full.onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.()};
function question(t){
 const r=Math.floor(t/3),n=[[4,5,6],[7,8,9],[6,7,8],[3,4,5],[5,6,7]][r][t%3],sq=n*n;
 return [
 [n+'² = ?',[sq,2*n,n+1],n+' · '+n+' = '+sq],
 [n+' · '+n+' өрнегін квадрат түрінде жаз',[n+'²',n+' · 2',n+' + 2'],n+' · '+n+' = '+n+'²'],
 ['□² = '+sq+'. Қай сан жетіспейді?',[n,n-1,n+1],n+'² = '+sq],
 [n+'² пен '+n+' · 2 мәндерін салыстыр',['>','=','<'],sq+' > '+2*n],
 [n+'² + 1 = ?',[sq+1,2*n+1,sq],sq+' + 1 = '+(sq+1)]
 ][r];
}
function start(){scores=[0,0,0];turn=0;play()}
function play(){
 locked=false;const team=turn%3;lanes(team);const [q,answers,why]=question(turn),correct=answers[0];
 const options=[...answers];for(let i=2;i>0;i--){const j=Math.floor(Math.random()*(i+1));[options[i],options[j]]=[options[j],options[i]]}
 panel.innerHTML='<small>'+ (Math.floor(turn/3)+1)+' / 5 айналым · '+teams[team]+'</small><h2></h2><div class="choices"></div><p id="feedback"></p><button id="next" hidden></button>';panel.querySelector('h2').textContent=q;
 for(const answer of options){const b=document.createElement('button');b.textContent=answer;panel.querySelector('.choices').append(b);b.onclick=()=>{if(locked)return;locked=true;const ok=answer===correct;if(ok){scores[team]++;const runner=arena.children[team].querySelector('.runner');runner.style.left='calc('+scores[team]*20+'% - '+scores[team]*7.6+'px)';arena.children[team].lastElementChild.textContent=scores[team]+'/5'}beep(ok?720:250);for(const el of panel.querySelectorAll('.choices button')){el.disabled=true;if(el.textContent===String(correct))el.className='good'}if(!ok)b.className='bad';feedback.textContent=(ok?'Дұрыс! Бір қадам алға. ':'Бірге тексерейік. ')+why;next.hidden=false;next.textContent=turn===14?'Нәтижені көру':'Келесі кезек →';next.onclick=()=>{turn++;turn===15?finish():play()}}}
}
function finish(){lanes();const best=Math.max(...scores),winners=teams.filter((_,i)=>scores[i]===best);panel.innerHTML='<small>🏆 Жарыс аяқталды</small><h2>'+ (winners.length===3?'Үш топ тең түсті!':winners.join(' және ')+' жеңді!')+'</h2><p>'+best+' / 5 ұпай</p><button onclick="start()">Қайта ойнау</button>';for(let i=0;i<36;i++){const s=document.createElement('span');s.className='spark';s.textContent='◆';s.style.cssText='left:'+Math.random()*100+'%;color:'+colors[i%3]+';animation-delay:'+Math.random()+'s';document.body.append(s);setTimeout(()=>s.remove(),3200)}}
lanes();panel.innerHTML='<small>3-СЫНЫП · МАТЕМАТИКА</small><h2>Қай шаршы алға шығады?</h2><p>Үш топ кезекпен жауап береді. Дұрыс жауап — бір қадам алға!<br>Әр айналымда тақтаға келесі ойыншы шығады.</p><button onclick="start()">Жарысты бастау →</button>';
</script></html>
